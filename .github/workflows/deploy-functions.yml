name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'MVP/Admin/backend/functions/**'
      - 'MVP/supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN nao configurado no repositorio."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Secret SUPABASE_PROJECT_ID nao configurado no repositorio."
            exit 1
          fi

      - name: Deploy criar-usuario
        working-directory: MVP
        run: supabase functions deploy criar-usuario --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy remover-usuario
        working-directory: MVP
        run: supabase functions deploy remover-usuario --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy vincular-admin
        working-directory: MVP
        run: supabase functions deploy vincular-admin --project-ref "$SUPABASE_PROJECT_ID"
